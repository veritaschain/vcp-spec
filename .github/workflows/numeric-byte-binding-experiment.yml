name: Unadopted numeric byte binding experiment

on:
  pull_request:
    paths:
      - 'experiments/numeric-byte-binding-v0/**'
      - 'experiments/numeric-representation-candidate-v0/**'
      - 'proposals/integrity-2026-10-24/byte-contract-candidate-v0/**'
      - 'proposals/numeric-fields-2026-10-25/**'
      - '.github/workflows/numeric-byte-binding-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-byte-binding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Check out candidate experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
      # sources.json pins imported numeric/byte-contract files to this commit.
      # Reproduction details: docs/EXPERIMENT_BASELINES.md
      - name: Check out pinned source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1131901d0b83f87c1c60674697574a60cc88fee1
          path: baseline
      - name: Stage candidate experiment over pinned sources
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p baseline/experiments
          cp -a candidate/experiments/numeric-byte-binding-v0 baseline/experiments/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned research dependencies
        run: python -m pip install -r experiments/numeric-byte-binding-v0/requirements.txt
      - name: Run synthetic composition and regressions
        run: python experiments/numeric-byte-binding-v0/run.py --output "${{ runner.temp }}/binding-${{ matrix.python }}.json"
      - name: Internal byte and Ed25519 crosscheck
        run: node experiments/numeric-byte-binding-v0/crosscheck.cjs "${{ runner.temp }}/binding-${{ matrix.python }}.json" > "${{ runner.temp }}/crosscheck-${{ matrix.python }}.json"
      - name: Report crosscheck regression controls
        run: node experiments/numeric-byte-binding-v0/test_crosscheck.cjs "${{ runner.temp }}/binding-${{ matrix.python }}.json" > "${{ runner.temp }}/crosscheck-controls-${{ matrix.python }}.json"
      - name: Save internal experimental output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unadopted-byte-binding-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/binding-${{ matrix.python }}.json
            ${{ runner.temp }}/crosscheck-${{ matrix.python }}.json
            ${{ runner.temp }}/crosscheck-controls-${{ matrix.python }}.json
          if-no-files-found: error
          retention-days: 30
