name: Unadopted numeric representation experiment

on:
  pull_request:
    paths:
      - 'experiments/numeric-representation-candidate-v0/**'
      - '.github/workflows/numeric-representation-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-numeric-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run candidate vectors and negative controls
        run: python experiments/numeric-representation-candidate-v0/run.py --output "${{ runner.temp }}/numeric-results-${{ matrix.python }}.json"
      - name: Save internal experimental output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unadopted-numeric-results-python-${{ matrix.python }}
          path: ${{ runner.temp }}/numeric-results-${{ matrix.python }}.json
          if-no-files-found: error
          retention-days: 30
