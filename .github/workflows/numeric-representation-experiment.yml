name: Unadopted numeric representation experiment

on:
  pull_request:
    paths:
      - 'experiments/numeric-representation-candidate-v0/**'
      - '.github/workflows/numeric-representation-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-numeric-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: baseline
    steps:
      - name: Check out candidate experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
      - name: Check out pinned source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 16018dd405cad45bd8b11a7dc2278f6d95111ea6
          path: baseline
      - name: Stage candidate experiment over pinned sources
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p baseline/experiments
          cp -a candidate/experiments/numeric-representation-candidate-v0 baseline/experiments/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run candidate vectors and negative controls
        run: python experiments/numeric-representation-candidate-v0/run.py --output "${{ runner.temp }}/numeric-results-${{ matrix.python }}.json"
      - name: Save internal experimental output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unadopted-numeric-results-python-${{ matrix.python }}
          path: ${{ runner.temp }}/numeric-results-${{ matrix.python }}.json
          if-no-files-found: error
          retention-days: 30
