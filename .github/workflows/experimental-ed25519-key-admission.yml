name: Experimental Ed25519 configured-key admission

on:
  pull_request:
    paths:
      - 'experiments/native-layout-migration-v0/**'
      - 'proposals/integrity-2026-10-24/byte-contract-candidate-v0/**'
      - '.github/workflows/experimental-ed25519-key-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-keys:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned experimental dependencies
        run: python -m pip install -r experiments/native-layout-migration-v0/requirements.txt
      - name: Current native-layout regression controls
        run: python -m unittest discover -s experiments/native-layout-migration-v0 -p 'test_checker.py' -v
      - name: Current byte-contract key admission controls
        run: python -m unittest discover -s proposals/integrity-2026-10-24/byte-contract-candidate-v0 -p 'test_ed25519_keys.py' -v
      - name: Recheck unchanged frozen byte vectors and Node byte agreement
        run: python proposals/integrity-2026-10-24/byte-contract-candidate-v0/check.py --node node
