name: SCITT receipt context replay

on:
  pull_request:
    paths:
      - 'proposals/scitt-receipt-context-2026-11-25/replay/**'
      - '.github/workflows/scitt-receipt-context-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proposals/scitt-receipt-context-2026-11-25/replay
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fixture bytes and input hashes
        run: |
          python make_fixtures.py --check
          sha256sum -c inputs.sha256
      - name: Replay the same inputs with Python and Go
        run: |
          python replay_python.py > "$RUNNER_TEMP/replay-python.json"
          (cd go && go run -mod=readonly . ..) > "$RUNNER_TEMP/replay-go.json"
      - name: Compare both reports with the expected results
        run: python compare.py "$RUNNER_TEMP/replay-python.json" "$RUNNER_TEMP/replay-go.json"
